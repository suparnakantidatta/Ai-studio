name: Build Pixel Pathsala APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: current

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p release_output
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" release_output/Pixel_pathsala_1.0.0.1.apk
            cp "$APK_FILE" Pixel_pathsala_1.0.0.1.apk
            echo "Successfully generated Pixel_pathsala_1.0.0.1.apk from $APK_FILE"
          else
            echo "Error: No APK file found in app/build/outputs/apk"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pixel_pathsala_1.0.0.1.apk
          path: Pixel_pathsala_1.0.0.1.apk
          retention-days: 90

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: Pixel_pathsala_1.0.0.1.apk
          name: Pixel Pathsala Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name || 'latest' }}
          body: |
            ## Pixel Pathsala Android App Release
            Automated build for Pixel Pathsala Tuition & ERP Management App.
            - File: Pixel_pathsala_1.0.0.1.apk
            - Built from commit: ${{ github.sha }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
